
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>License Plate Recognition</title>

    <link rel="stylesheet" href="/static/style.css">

</head>


<body>

    <div class="container">

        <h1>License Plate Recognition</h1>

        <p class="subtitle">
            Upload an image to detect a license plate
        </p>


        <div class="upload-box">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <button onclick="predictPlate()">
                Detect License Plate
            </button>

        </div>


        <div id="preview"></div>


        <div id="loading">
            Processing image...
        </div>


        <div id="result"></div>

    </div>


   <script src="/static/script.js"></script>

</body>

</html>
